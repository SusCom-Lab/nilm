{
  "experiment_name": "context_film_seq2point_wm_dev",
  "dataset": "REFIT",
  "appliance": "washing_machine",
  "seed": 42,
  "window_size": 599,
  "hidden_dim": 1024,
  "context_k": 16,
  "context_selector": "uniform",
  "context_code_dim": 128,
  "generator_hidden_dim": 256,

  "house_split": {
    "train": ["H1", "H2", "H3", "H7"],
    "validation": ["H5"],
    "test": ["H6"]
  },

  "fixed_14_day_starts": {
    "H1": "2013-10-09 13:06:12",
    "H2": "2013-09-17 22:08:06",
    "H3": "2013-09-25 19:21:06",
    "H5": "2013-09-26 09:56:06",
    "H6": "2013-11-28 12:15:30",
    "H7": "2013-11-01 22:01:18"
  },

  "data": {
    "csv_dir": "dataset/refit/exported_csv/REFIT_dataset",
    "filename_template": "{appliance}_{house}.csv",
    "chunksize": 250000
  },
  "training": {
    "baseline_epochs": 30,
    "global_film_epochs": 20,
    "context_film_epochs": 20,
    "minimum_epochs": 20,
    "batch_size": 256,
    "learning_rate": 0.001,
    "adapter_learning_rate": 0.001,
    "patience": 8,
    "min_delta": 0.0001,
    "num_workers": 0
  },
  "evaluation": {
    "batch_size": 1000,
    "status_rule_source": "model_pipeline/appliance_status_rules.json"
  },
  "artifacts_root": "artifacts/context_film_seq2point_wm_dev",
  "default_run_id": "refit_wm_seed42"
}
