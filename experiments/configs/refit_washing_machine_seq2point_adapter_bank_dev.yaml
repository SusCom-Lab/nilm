{
  "experiment_name": "context_routed_adapter_refit_wm_dev",
  "dataset": "REFIT",
  "appliance": "washing_machine",
  "seed": 42,
  "window_size": 599,
  "hidden_dim": 1024,
  "context_k": 16,
  "context_selector": "uniform",
  "context_code_dim": 128,
  "num_adapters": 2,
  "adapter_bottleneck_dim": 64,
  "adapter_activation": "ReLU",
  "residual_scale": 0.1,
  "router_temperature": 1.0,
  "routing": "softmax",
  "hard_routing": false,

  "house_split": {
    "train": ["H1", "H2", "H3", "H7"],
    "validation": ["H5"],
    "test": ["H6"]
  },

  "fixed_14_day_starts": {
    "H1": "2013-10-09 13:06:12",
    "H2": "2013-09-17 22:08:06",
    "H3": "2013-09-25 19:21:06",
    "H5": "2013-09-26 09:56:06",
    "H6": "2013-11-28 12:15:30",
    "H7": "2013-11-01 22:01:18"
  },

  "data": {
    "csv_dir": "dataset/refit/exported_csv/REFIT_dataset",
    "filename_template": "{appliance}_{house}.csv",
    "chunksize": 250000
  },
  "training": {
    "optimizer": "AdamW",
    "adapter_learning_rate": 0.001,
    "weight_decay": 0.0001,
    "max_epochs": 20,
    "minimum_epochs": 1,
    "patience": 8,
    "min_delta": 0.0001,
    "gradient_clip_norm": 5.0,
    "batch_size": 256,
    "num_workers": 0
  },
  "evaluation": {
    "batch_size": 1000,
    "expected_timestamp_count": 95060,
    "status_rule_source": "model_pipeline/appliance_status_rules.json"
  },
  "film_reference": {
    "manifest": "artifacts/context_film_seq2point_wm_dev/refit_wm_seed42_run3/manifest.json",
    "predictions": "artifacts/context_film_seq2point_wm_dev/refit_wm_seed42_run3/h6_b_predictions.csv",
    "method_column": "M2 Correct Context"
  },
  "artifacts_root": "artifacts/context_routed_adapter_refit_wm_dev"
}
